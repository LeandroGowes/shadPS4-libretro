name: Libretro Cores — Windows and Linux (Manual)

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platforms to build
        required: true
        type: choice
        default: both
        options:
          - both
          - windows
          - linux
      revision:
        description: Commit or tag to build (leave blank to use this run's revision)
        required: false
        type: string
        default: ''
      create_release:
        description: Create a GitHub release automatically when the build finishes?
        required: false
        type: boolean
        default: true
      draft:
        description: Create a draft release? If false, publish it immediately.
        required: false
        type: boolean
        default: false
      tag_name:
        description: Release tag (for example v0.19.1-libretro.3; leave blank to generate one)
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  source:
    runs-on: ubuntu-22.04
    outputs:
      commit: ${{ steps.resolve.outputs.commit }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.revision || github.sha }}
      - id: resolve
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  windows:
    if: ${{ inputs.platform != 'linux' }}
    needs: source
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.source.outputs.commit }}
          submodules: recursive
      - name: Check out packaging scripts for this workflow run
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: _ci
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Install pinned build tools
        shell: pwsh
        run: |
          python -m pip install cmake==3.31.10 ninja==1.11.1.4
          if ($LASTEXITCODE -ne 0) { throw 'Failed to install CMake and Ninja.' }
          $toolDir = Join-Path $env:RUNNER_TEMP 'llvm-mingw'
          New-Item -ItemType Directory -Path $toolDir -Force | Out-Null
          Invoke-WebRequest 'https://github.com/mstorsjo/llvm-mingw/releases/download/20260922/llvm-mingw-20260922-ucrt-x86_64.zip' -OutFile "$toolDir/compiler.zip"
          Expand-Archive "$toolDir/compiler.zip" -DestinationPath $toolDir
          "LLVM_ROOT=$toolDir/llvm-mingw-20260922-ucrt-x86_64" >> $env:GITHUB_ENV
      - name: Build Windows DLL
        shell: pwsh
        run: ./scripts/build-libretro-windows.ps1 -CompilerBin "$env:LLVM_ROOT/bin" -Jobs 2
      - name: Package DLL, licenses, and metadata
        shell: pwsh
        run: |
          python _ci/.github/scripts/package-libretro-windows.py
          Get-Content dist/windows/SHA256SUMS-windows.txt >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: shadps4-libretro-windows-x86_64
          path: |
            dist/windows/*.zip
            dist/windows/build-info-windows.json
            dist/windows/SHA256SUMS-windows.txt
          if-no-files-found: error
          retention-days: 7

  linux:
    if: ${{ inputs.platform != 'windows' }}
    needs: source
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.source.outputs.commit }}
          submodules: recursive
      - name: Prepare portable Linux build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap ripgrep curl binutils
      - name: Build portable Linux core
        env:
          JOBS: '2'
        run: bash scripts/build-libretro-portable.sh
      - name: Record source revision and checksum
        run: |
          cat build-libretro-portable/build/dist/release-metadata.json >> "$GITHUB_STEP_SUMMARY"
          cat build-libretro-portable/shadps4-libretro-linux-x86_64.tar.gz.sha256 >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: shadps4-libretro-linux-x86_64
          path: |
            build-libretro-portable/shadps4-libretro-linux-x86_64.tar.gz
            build-libretro-portable/shadps4-libretro-linux-x86_64.tar.gz.sha256
            build-libretro-portable/build/dist/release-metadata.json
          if-no-files-found: error
          retention-days: 7

  release:
    if: ${{ always() && inputs.create_release && (needs.windows.result == 'success' || needs.linux.result == 'success') }}
    needs: [source, windows, linux]
    runs-on: ubuntu-22.04
    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Set release metadata
        id: meta
        shell: bash
        run: |
          SHORT_SHA=$(echo "${{ needs.source.outputs.commit }}" | cut -c1-9)
          DATE=$(date +'%Y-%m-%d')
          if [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
          else
            TAG="v0.19.1-libretro-${DATE}-${SHORT_SHA}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "title=shadPS4 Libretro (${DATE} - ${SHORT_SHA})" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ needs.source.outputs.commit }}
          name: ${{ steps.meta.outputs.title }}
          draft: ${{ inputs.draft }}
          prerelease: true
          generate_release_notes: true
          files: |
            release-assets/*.zip
            release-assets/*.tar.gz
            release-assets/*.sha256
            release-assets/*.txt
            release-assets/*.json
